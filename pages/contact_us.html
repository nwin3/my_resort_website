<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Desert Bloom Resort</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="canonical" href="https://www.desertbloomcamps.com/pages/contact_us.html" />
</head>
<body class="bg-stone-50 text-stone-800">

    <div id="nav-placeholder"></div>
    <script src="../loader.js"></script>
    <main class="max-w-6xl mx-auto py-16 px-6">
        <h1 class="text-4xl font-serif text-amber-900 text-center mb-12"></h1>

        <div class="grid md:grid-cols-2 gap-12">
            <!-- Left: Contact Details & Map -->
            <div class="space-y-8">
                <div>
                    <h3 class="text-2xl font-serif font-bold mb-4 text-amber-900">Get in Touch</h3>
                    <p class="text-stone-600 font-semibold">
                        Come as a stranger, leave as a friend. Reach out to us directly for bookings or any questions about your desert stay—we’re always here to help.
                    </p>
                </div>
                
<div class="space-y-4">
    <div class="flex items-start space-x-4">
        <i class="fa-solid fa-location-dot text-amber-700 mt-1"></i>
        <p class="text-stone-700 font-bold">Desert Bloom Resort & Camp, Jaisalmer,<br>Rajasthan, India</p>
    </div>
    <div class="flex items-center space-x-4">
        <i class="fa-solid fa-phone text-amber-700"></i>
        <a href="tel:+919772007882" class="text-stone-700 font-bold hover:text-amber-800 transition">
            +91 9358872644
        </a>
    </div>
    <div class="flex items-center space-x-4">
        <i class="fa-solid fa-envelope text-amber-700"></i>
        <a href="mailto:info@desertbloomcamps.com" class="text-stone-700 font-bold hover:text-amber-800 transition">
            info@desertbloomcamps.com
        </a>
    </div>
</div>

                <!-- Google Map Embed -->
                <div class="w-full h-64 rounded-xl overflow-hidden shadow-md border border-stone-200">
                    <iframe 
                        src="https://maps.google.com/maps?q=Desert%20Bloom%20Camp%20and%20Resort&t=&z=15&ie=UTF8&iwloc=&output=embed" 
                        width="100%" 
                        height="100%" 
                        style="border:0;" 
                        allowfullscreen="" 
                        loading="lazy" 
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
            </div>

            <!-- Right: Contact Form -->
            <div class="bg-white p-8 rounded-xl shadow-lg border border-stone-100 h-fit">
                <h3 class="text-xl font-bold mb-6">Send us a Message</h3>
                
                <form id="inquiryForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1 text-stone-700">Your Name</label>
                        <input type="text" name="name" class="w-full p-2 border border-stone-300 rounded focus:ring-2 focus:ring-amber-600 outline-none" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1 text-stone-700">Email Address</label>
                        <input type="email" name="email" class="w-full p-2 border border-stone-300 rounded focus:ring-2 focus:ring-amber-600 outline-none" required>
                    </div>
                    
                    <!-- NEW: Phone Number Section -->
                    <div>
                        <label class="block text-sm font-medium mb-1 text-stone-700">Phone Number</label>
                        <div class="flex gap-2">
                            <select name="countryCode" id="countryCode" class="p-2 border border-stone-300 rounded bg-white w-1/3"></select>
                            <input type="tel" name="phone" placeholder="Phone Number" class="w-full p-2 border border-stone-300 rounded focus:ring-2 focus:ring-amber-600 outline-none" required>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1 text-stone-700">Inquiry Subject</label>
                        <select name="subject" class="w-full p-2 border border-stone-300 rounded focus:ring-2 focus:ring-amber-600 outline-none">
                            <option>General Inquiry</option>
                            <option>Booking Request</option>
                            <option>Group/Event Booking</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1 text-stone-700">Message</label>
                        <textarea name="message" rows="4" class="w-full p-2 border border-stone-300 rounded focus:ring-2 focus:ring-amber-600 outline-none"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-amber-900 text-white py-3 rounded font-bold hover:bg-amber-800 transition duration-300">
                        Send Message
                    </button>
                </form>

                <!-- Load Scripts -->
                <script src="country.js"></script>
                <script>populateCountryCodes('countryCode');</script>
                <script src="form_handler.js"></script>
              
            </div>
        </div>
    </main>

    
    <div id="footer-placeholder"></div>
    <script src="../loader.js"></script>
</body>
</html>
