<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Desert Bloom Resort</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-800">

    <!-- Navigation Placeholder -->
    <div id="nav-placeholder"></div>
    <script src="/loader.js"></script>

    <main class="max-w-6xl mx-auto py-16 px-6">
        <h1 class="text-4xl font-serif text-amber-900 text-center mb-12">Our Gallery</h1>

        <!-- Image Gallery Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <!-- Replace the src with your actual image paths -->
            <div class="overflow-hidden rounded-lg shadow-md">
                <img src="/images/desert1.jpg" alt="Desert Landscape" class="w-full h-64 object-cover hover:scale-105 transition duration-500">
            </div>
            <div class="overflow-hidden rounded-lg shadow-md">
                <img src="/images/desert2.jpg" alt="Luxury Tent" class="w-full h-64 object-cover hover:scale-105 transition duration-500">
            </div>
            <div class="overflow-hidden rounded-lg shadow-md">
                <img src="/images/desert3.jpg" alt="Camel Safari" class="w-full h-64 object-cover hover:scale-105 transition duration-500">
            </div>
            <!-- Add more <div> blocks as needed -->
        </div>
    </main>

</body>
</html>
