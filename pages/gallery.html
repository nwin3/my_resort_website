<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Desert Bloom Resort</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-800">

    <!-- Navigation Placeholder -->
    <div id="nav-placeholder"></div>
    <script src="/loader.js"></script>

    <!-- Update your main container class -->
<!-- Use this container structure -->
<!-- We use 'w-full' to ensure the main container takes the full width -->
<main class="w-full px-4 md:px-8 py-16">
    <h1 class="text-4xl font-serif text-amber-900 text-center mb-12">Our Gallery</h1>

    <!-- 
       'grid-cols-1' -> Mobile: 1 image
       'md:grid-cols-2' -> Tablet: 2 images
       'xl:grid-cols-3' -> Large Desktop: 3 images
       '2xl:grid-cols-4' -> Huge screens: 4 images
       'w-full' -> Ensures the grid occupies 100% of the parent width
    -->
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-6 w-full">
        
        <!-- Image 1 -->
        <div class="overflow-hidden rounded-xl shadow-lg w-full">
            <img src="../assets/royal_swiss_tents.png" alt="Royal Swiss Tents" class="w-full h-80 object-cover hover:scale-105 transition duration-500">
        </div>
        
        <!-- Image 2 -->
        <div class="overflow-hidden rounded-xl shadow-lg w-full">
            <img src="../assets/premium_mud_cottage.png" alt="Premium Mud Cottage" class="w-full h-80 object-cover hover:scale-105 transition duration-500">
        </div>
        
        <!-- Image 3 -->
        <div class="overflow-hidden rounded-xl shadow-lg w-full">
            <img src="../assets/family_desert_suite.png" alt="Family Desert Suite" class="w-full h-80 object-cover hover:scale-105 transition duration-500">
        </div>

    </div>
</main>

    

</body>
</html>
