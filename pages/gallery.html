    <!-- Full Image Modal (Lightbox) -->
    <div id="imageModal" class="fixed inset-0 bg-black/90 z-50 hidden opacity-0 transition-opacity duration-300 flex flex-col items-center justify-center p-4">
        <button id="closeModal" class="absolute top-6 right-6 text-white text-3xl hover:text-amber-400 transition" aria-label="Close modal">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="max-w-5xl max-h-[85vh] flex flex-col items-center">
            <img id="modalImg" src="" alt="" class="max-w-full max-h-[75vh] object-contain rounded-lg shadow-2xl">
            <p id="modalCaption" class="text-white text-lg font-serif mt-4 text-center"></p>
        </div>
    </div>

    <div id="footer-placeholder"></div>
    <script src="../loader.js"></script>

    <!-- Modal Interactive Logic -->
    <script>
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const modalCaption = document.getElementById('modalCaption');
        const closeModal = document.getElementById('closeModal');
        const galleryItems = document.querySelectorAll('.gallery-item');

        function openModal(imgSrc, imgAlt) {
            modalImg.src = imgSrc;
            modalCaption.textContent = imgAlt;
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
            document.body.classList.add('overflow-hidden');
        }

        function hideModal() {
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                modalImg.src = '';
                document.body.classList.remove('overflow-hidden');
            }, 300);
        }

        galleryItems.forEach(item => {
            const img = item.querySelector('img');
            item.addEventListener('click', () => openModal(img.src, img.alt));
        });

        closeModal.addEventListener('click', hideModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) hideModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
                hideModal();
            }
        });
    </script>
