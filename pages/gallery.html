<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Desert Bloom Resort</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-800">

    <!-- Navigation Placeholder -->
    <div id="nav-placeholder"></div>
    <script src="/loader.js"></script>

    <!-- Update your main container class -->
<main class="max-w-[90%] mx-auto py-16 px-6"> 
    <h1 class="text-4xl font-serif text-amber-900 text-center mb-12">Our Gallery</h1>

    <!-- Updated Grid: 2 columns on medium, 3 on large, 4 on extra large -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        
        <!-- Image 1 -->
        <div class="overflow-hidden rounded-xl shadow-lg">
            <!-- Increased height to h-80 (from h-64) for larger images -->
            <img src="../assets/royal_swiss_tents.png" alt="Desert Landscape" class="w-full h-80 object-cover hover:scale-105 transition duration-500">
        </div>
        
        <!-- Image 2 -->
        <div class="overflow-hidden rounded-xl shadow-lg">
            <img src="../assets/premium_mud_cottage.png" alt="Luxury Tent" class="w-full h-80 object-cover hover:scale-105 transition duration-500">
        </div>
        
        <!-- Image 3 -->
        <div class="overflow-hidden rounded-xl shadow-lg">
            <img src="../assets/family_desert_suite.png" alt="Camel Safari" class="w-full h-80 object-cover hover:scale-105 transition duration-500">
        </div>
        
    </div>
</main>

    

</body>
</html>
