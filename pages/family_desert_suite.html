<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Desert Suite | Desert Bloom Resort</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-stone-50 text-stone-800">

    <header class="py-10 text-center">
        <h1 class="text-4xl font-serif text-amber-900">Family Desert Suite</h1>
    </header>

    <main class="max-w-4xl mx-auto px-6 pb-16">
        <img src="../assets/family_desert_suite.png" alt="Family Desert Suite Interior"
            class="w-full h-96 object-cover rounded-xl shadow-lg mb-8">

        <div class="grid md:grid-cols-2 gap-12">
            <div>
                <h2 class="text-2xl font-serif mb-4">Spacious Comfort for the Whole Family</h2>
                <p class="text-stone-600 leading-relaxed mb-6">
                    Designed with families in mind, our Family Desert Suite offers an expansive living space
                    that combines traditional Rajasthani elegance with modern convenience.
                </p>
                <ul class="list-disc list-inside text-stone-700 space-y-2">
                    <li>Expansive Suite Layout</li>
                    <li>Dual Queen Beds</li>
                </ul>
            </div>

            <div class="bg-white p-8 rounded-xl shadow-sm border border-stone-100">
                <h3 class="text-xl font-bold mb-4">Check Availability</h3>
                <form id="inquiryForm" class="space-y-4">
                    <input type="hidden" name="roomType" value="Family Desert Suite">
                    
                    <input type="text" name="name" id="name" placeholder="Your Name" class="w-full p-2 border rounded" required>

                    <div class="flex gap-2">
                        <select name="countryCode" id="countryCode" class="p-2 border rounded bg-white w-1/3"></select>
                        <input type="tel" name="phone" placeholder="Phone Number" class="w-full p-2 border rounded" required>
                    </div>
                    
                    <input type="email" name="email" id="email" placeholder="Email Address" class="w-full p-2 border rounded" required>
                    
                    <input type="date" name="date" id="date" class="w-full p-2 border rounded" required>
                    
                    <button type="submit" class="w-full bg-amber-900 text-white py-2 rounded">Send Inquiry</button>
                </form>

                <script src="country.js"></script>
                <script>populateCountryCodes('countryCode');</script>
                <script src="form_handler.js"></script>
            </div>
        </div>
    </main>
</body>

</html>

</html>
