<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Desert Bloom Resort</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-stone-50 text-stone-800">

    <main class="max-w-5xl mx-auto py-16 px-6">
        <h1 class="text-4xl font-serif text-amber-900 text-center mb-12">Get in Touch</h1>

        <div class="grid md:grid-cols-2 gap-12">
            <!-- Left: Contact Details -->
            <div class="space-y-8">
                <div>
                    <h3 class="text-xl font-bold mb-4 text-amber-900">Reach Out</h3>
                    <p class="text-stone-600 mb-6">Have questions about your desert getaway? Our team is here to help you plan your perfect stay at Desert Bloom.</p>
                </div>
                
                <div class="space-y-4">
                    <div class="flex items-start space-x-4">
                        <i class="fa-solid fa-location-dot text-amber-700 mt-1"></i>
                        <p>Sam Sand Dunes, Jaisalmer,<br>Rajasthan, India</p>
                    </div>
                    <div class="flex items-center space-x-4">
                        <i class="fa-solid fa-phone text-amber-700"></i>
                        <a href="tel:+919999999999" class="hover:text-amber-800">+91 99999 99999</a>
                    </div>
                    <div class="flex items-center space-x-4">
                        <i class="fa-solid fa-envelope text-amber-700"></i>
                        <a href="mailto:info@desertbloomcamp.com" class="hover:text-amber-800">info@desertbloomcamp.com</a>
                    </div>
                </div>

                <!-- Simple Map Placeholder -->
                <div class="w-full h-48 bg-stone-200 rounded-lg flex items-center justify-center text-stone-500">
                    [Google Map Embed Area]
                </div>
            </div>

            <!-- Right: Contact Form -->
            <div class="bg-white p-8 rounded-xl shadow-lg border border-stone-100">
                <form id="contactForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Name</label>
                        <input type="text" name="name" class="w-full p-2 border border-stone-300 rounded" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Email</label>
                        <input type="email" name="email" class="w-full p-2 border border-stone-300 rounded" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Subject</label>
                        <select name="subject" class="w-full p-2 border border-stone-300 rounded">
                            <option>General Inquiry</option>
                            <option>Booking Request</option>
                            <option>Group/Event Booking</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Message</label>
                        <textarea name="message" rows="4" class="w-full p-2 border border-stone-300 rounded"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-amber-900 text-white py-3 rounded font-bold hover:bg-amber-800 transition">Send Message</button>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
