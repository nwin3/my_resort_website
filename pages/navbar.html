    @media (max-width: 768px) {
        .nav-tabs { display: none; }
        .nav-mobile { display: block; }
    }
</style>

<nav style="width: 100%; background: white; padding: 1rem; border-bottom: 1px solid #ddd; position: relative;">
    <div style="max-width: 1200px; margin: auto; display: flex; justify-content: space-between; align-items: center;">
        <div style="font-weight: bold; font-size: 1.5rem;">Desert Bloom</div>
        
        <div class="nav-tabs" style="gap: 20px;">
            <a href="/">Home</a>
            <a href="/pages/experience.html">Experiences</a>
            <a href="/pages/gallery.html">Gallery</a>
            <a href="/pages/contact_us.html">Contact</a>
        </div>

        <button id="mobile-toggle" class="nav-mobile" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">☰</button>
    </div>

    <!-- MOBILE MENU -->
<!-- MOBILE MENU -->
<div id="mobile-menu" style="display: none !important; padding: 1rem; border-top: 1px solid #eee; flex-direction: column; align-items: center;">
    
    <!-- The links are now in a container that only takes the width it needs -->
    <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 15px; width: fit-content;">
        <a href="/" style="text-decoration: none; color: #333; font-weight: 500;">Home</a>
        <a href="/pages/experience.html" style="text-decoration: none; color: #333; font-weight: 500;">Experiences</a>
        <a href="/pages/gallery.html" style="text-decoration: none; color: #333; font-weight: 500;">Gallery</a>
        <a href="/pages/contact_us.html" style="text-decoration: none; color: #333; font-weight: 500;">Contact</a>
    </div>
    
</div>

</nav>

<script>
    // This script listens to the whole document, so it doesn't matter when the nav loads
    document.addEventListener('click', function(e) {
        if (e.target && e.target.id === 'mobile-toggle') {
            const menu = document.getElementById('mobile-menu');
            menu.style.display = (menu.style.display === 'none' || menu.style.display === '') ? 'block' : 'none';
        }
    });
</script>
