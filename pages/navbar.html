<style>
    /* Desktop: Show tabs, Hide hamburger */
    .nav-tabs { display: flex; }
    .nav-mobile { display: none; }
    
    /* Mobile: Hide tabs, Show hamburger */
    @media (max-width: 768px) {
        .nav-tabs { display: none; }
        .nav-mobile { display: block; }
    }
</style>

<nav style="width: 100%; background: white; padding: 1rem; border-bottom: 1px solid #ddd; position: relative;">
    <div style="max-width: 1200px; margin: auto; display: flex; justify-content: space-between; align-items: center;">
        
        <div style="font-weight: bold; font-size: 1.5rem;">Desert Bloom</div>

        <!-- DESKTOP TABS -->
        <div class="nav-tabs" style="gap: 20px;">
            <a href="/">Home</a>
            <a href="/pages/experience.html">Experiences</a>
            <a href="/pages/gallery.html">Gallery</a>
        </div>

        <!-- MOBILE HAMBURGER -->
        <button class="nav-mobile" id="mobile-toggle" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">☰</button>
    </div>

    <!-- MOBILE MENU (Hidden by default) -->
    <div id="mobile-menu" style="display: none; padding: 1rem; text-align: center; border-top: 1px solid #eee;">
        <a href="/" style="display: block; padding: 0.5rem;">Home</a>
        <a href="/pages/experience.html" style="display: block; padding: 0.5rem;">Experiences</a>
        <a href="/pages/gallery.html" style="display: block; padding: 0.5rem;">Gallery</a>
    </div>
</nav>

<script>
    document.getElementById('mobile-toggle').addEventListener('click', function() {
        var m = document.getElementById('mobile-menu');
        m.style.display = (m.style.display === 'none' || m.style.display === '') ? 'block' : 'none';
    });
</script>
