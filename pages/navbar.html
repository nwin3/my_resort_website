<!-- NAV START -->
<nav style="width: 100%; background: #ffffff; padding: 15px 0; border-bottom: 1px solid #ddd; position: relative; z-index: 1000;">
    <div style="max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 20px;">
        
        <!-- Logo -->
        <div style="font-size: 20px; font-weight: bold;">Desert Bloom</div>

        <!-- Hamburger Button -->
        <button id="mobile-toggle" style="background: none; border: none; cursor: pointer; font-size: 24px;">
            ☰
        </button>
    </div>

    <!-- Mobile Menu -->
    <div id="mobile-nav" style="display: none; background: #f9f9f9; padding: 20px; text-align: center; border-bottom: 1px solid #eee;">
        <a href="/" style="display: block; padding: 10px; text-decoration: none; color: #333;">Home</a>

    </div>

<!-- NAV SCRIPT -->
<script>
    document.getElementById('mobile-toggle').addEventListener('click', function() {
        var menu = document.getElementById('mobile-nav');
        if (menu.style.display === 'none' || menu.style.display === '') {
            menu.style.display = 'block';
        } else {
            menu.style.display = 'none';
        }
    });
</script>
