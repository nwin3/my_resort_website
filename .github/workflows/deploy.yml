name: Deploy to MilesWeb

on:
  push:
    branches:
      - main  # Change this if your default branch is 'master'

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v3

      # If you are using React/Next.js/Vue, uncomment the lines below:
      # - name: Build Project
      #   run: |
      #     npm install
      #     npm run build

      - name: Sync files with FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.REMOTE_PATH }}
          # If you have a build folder (like 'dist' or 'build'), 
          # change local-dir to './dist' or './build'
          local-dir: ./
